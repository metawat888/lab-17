<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Virtual 2D Chemistry Lab Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            background: #04060b;
            color: #f8fafc;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            overscroll-behavior: none;
        }

        .top-dashboard {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            z-index: 20;
            flex-shrink: 0;
            min-height: 64px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: thin;
            scrollbar-color: #38bdf8 rgba(15, 23, 42, 0.8);
            touch-action: pan-x;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6);
        }

        .top-dashboard::-webkit-scrollbar {
            height: 5px;
        }
        .top-dashboard::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.8);
        }
        .top-dashboard::-webkit-scrollbar-thumb {
            background-color: #38bdf8;
            border-radius: 4px;
        }

        .logo {
            font-size: 1.15rem;
            font-weight: 700;
            background: linear-gradient(135deg, #38bdf8, #818cf8, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            flex-shrink: 0;
            margin-right: 15px;
            text-shadow: 0 0 25px rgba(56, 189, 248, 0.5);
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: nowrap;
            flex-shrink: 0;
        }

        .dash-card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
            transition: border-color 0.3s;
        }
        .dash-card:hover {
            border-color: rgba(56, 189, 248, 0.3);
        }

        label {
            font-size: 0.75rem;
            color: #94a3b8;
            font-weight: 500;
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select, input {
            background: rgba(2, 6, 23, 0.7);
            border: 1px solid #475569;
            color: #f8fafc;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
            transition: all 0.2s;
            cursor: pointer;
        }

        select:focus, input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
        }

        .btn {
            background: linear-gradient(135deg, #0ea5e9, #4f46e5);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4);
            flex-shrink: 0;
            min-height: 36px;
        }

        .btn:hover, .btn:active {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(14, 165, 233, 0.6);
            background: linear-gradient(135deg, #0284c7, #4338ca);
        }

        .btn-danger {
            background: linear-gradient(135deg, #e11d48, #9f1239);
            box-shadow: 0 4px 15px rgba(225, 29, 72, 0.4);
        }

        .btn-danger:hover {
            box-shadow: 0 6px 20px rgba(225, 29, 72, 0.6);
            background: linear-gradient(135deg, #be123c, #881337);
        }

        .workspace {
            position: relative;
            flex: 1;
            background: radial-gradient(circle at 50% 30%, #1e293b 0%, #04060b 100%);
            background-image: 
                linear-gradient(rgba(56, 189, 248, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            background-position: center center;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        #labCanvas {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
            touch-action: none;
        }

        .explanation-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(56, 189, 248, 0.5);
            border-radius: 12px;
            padding: 20px 24px;
            width: 400px;
            max-width: calc(100vw - 40px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(56, 189, 248, 0.15);
            z-index: 10;
            pointer-events: auto;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: top right;
        }

        .explanation-panel.hidden {
            opacity: 0;
            transform: scale(0.95) translateY(-20px);
            pointer-events: none;
        }

        .explanation-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 10px;
        }

        .explanation-title {
            font-size: 1rem;
            font-weight: 700;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        .close-expl {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .close-expl:hover {
            background: rgba(225, 29, 72, 0.8);
            color: #fff;
            border-color: transparent;
        }

        .explanation-body {
            font-size: 0.85rem;
            color: #e2e8f0;
            line-height: 1.7;
        }

        .stage-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 0.8rem;
            color: #bae6fd;
            pointer-events: none;
            z-index: 5;
            white-space: nowrap;
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.25);
            animation: pulse-hint 2.5s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes pulse-hint {
            0%, 100% { box-shadow: 0 4px 20px rgba(56, 189, 248, 0.2); transform: translateX(-50%) scale(1); }
            50% { box-shadow: 0 4px 30px rgba(56, 189, 248, 0.6); border-color: rgba(56, 189, 248, 0.8); transform: translateX(-50%) scale(1.02); }
        }
    </style>
</head>
<body>
    <header class="top-dashboard">
        <div class="logo">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 3h6v3H9z"/><path d="M10 6v5l-4.5 8.5A1 1 0 0 0 6.4 21h11.2a1 1 0 0 0 .9-1.5L14 11V6"/></svg>
            ChemLab Pro
        </div>

        <div class="controls-group">
            <div class="dash-card">

                    <option value="precipitation">2. การเกิดตะกอน (CuSO₄ + NaOH)</option>
                    <option value="redox">3. ปฏิกิริยารีดอกซ์ (KMnO₄ + HCl)</option>
                    <option value="acidmetal">4. ปฏิกิริยากรดกับโลหะ (HCl + Zn)</option>
                    <option value="barium">5. การเกิดตะกอนซัลเฟต (BaCl₂ + CuSO₄)</option>
                    <option value="ammonia">6. ปฏิกิริยาเกิดแก๊สแอมโมเนีย (NH₄Cl + NaOH)</option>
                    <option value="indicator">7. การเปลี่ยนสีอินดิเคเตอร์ (NaOH + Phenol)</option>
                    <option value="chromate">8. สมดุลไอออนโครเมต (K₂CrO₄ + HCl)</option>
                    <option value="gascolor">9. ปฏิกิริยาเปลี่ยนสีพร้อมฟองแก๊ส (Cu + HNO₃)</option>
                    <option value="caco3">10. ปฏิกิริยากรดกับหินปูน (HCl + CaCO₃)</option>
                    <option value="exothermic">11. ปฏิกิริยาคายความร้อน (CaO + H₂O)</option>
                    <option value="endothermic">12. ปฏิกิริยาดูดความร้อน (Ba(OH)₂ + NH₄NO₃)</option>
                    <option value="saponification">13. เบสกับไขมัน (NaOH + น้ำมัน)</option>
                    <option value="photosynthesis">14. การสังเคราะห์ด้วยแสง (คลอโรฟิลล์ + CO₂)</option>
                    <option value="titration_reversal">15. สีอินดิเคเตอร์กลับไปมา (NaOH + Phenol + HCl)</option>
                    <option value="amphoteric">16. ตะกอนแอมโฟเทอริก (AlCl₃ + NaOH + NaOH)</option>
                    <option value="copper_complex">17. สารเชิงซ้อนสีน้ำเงิน (CuSO₄ + NaOH + NH₃)</option>
                    <option value="iodine_starch">18. ปฏิกิริยาแป้ง-ไอโอดีน (KI + Starch + H₂O₂)</option>
                    <option value="fake_blood">19. เลือดเทียมและการล้างสี (FeCl₃ + KSCN + NaF)</option>
                    <option value="golden_rain">20. ฝนทองคำ (Pb(NO₃)₂ + KI + น้ำร้อน)</option>
                    <option value="clf3_explosion">21. การระเบิดรุนแรงของ ClF₃ (ClF₃ + H₂O)</option>
                    <option value="nuclear_fission">22. จำลองนิวเคลียร์ฟิชชัน (²³⁵U + n)</option>
                    <option value="sugar_test">23. ทดสอบน้ำตาล (Glucose + Benedict + Heat)</option>
                    <option value="starch_test">24. ทดสอบแป้ง (Starch + Iodine)</option>
                    <option value="protein_test">25. ทดสอบโปรตีน (Protein + NaOH + CuSO₄)</option>
                </select>
            </div>

            <div class="dash-card">
                <label>สารเคมี</label>
                <select id="chemSelect" style="width: 180px;" aria-label="เลือกสารเคมี">
                    <option value="water">น้ำกลั่น (H₂O)</option>
                    <option value="hcl">กรดไฮโดรคลอริก (HCl)</option>
                    <option value="naoh">โซเดียมไฮดรอกไซด์ (NaOH)</option>
                    <option value="copt">คอปเปอร์ซัลเฟต (CuSO₄)</option>
                    <option value="kmno4">ด่างทับทิม (KMnO₄)</option>
                    <option value="bacl2">แบเรียมคลอไรด์ (BaCl₂)</option>
                    <option value="nh4cl">แอมโมเนียมคลอไรด์ (NH₄Cl)</option>
                    <option value="zn">โลหะสังกะสี (Zn)</option>
                    <option value="phenol">ฟีนอลฟทาลีน</option>
                    <option value="chromate">โพแทสเซียมโครเมต (K₂CrO₄)</option>
                    <option value="cu">โลหะทองแดง (Cu)</option>
                    <option value="hno3">กรดไนตริก (HNO₃)</option>
                    <option value="caco3">หินปูน (CaCO₃)</option>
                    <option value="cao">แคลเซียมออกไซด์ (CaO)</option>
                    <option value="baoh2">แบเรียมไฮดรอกไซด์ (Ba(OH)₂)</option>
                    <option value="nh4no3">แอมโมเนียมไนเตรต (NH₄NO₃)</option>
                    <option value="oil">น้ำมันพืช (Lipid)</option>
                    <option value="nahco3">โซเดียมไบคาร์บอเนต (NaHCO₃)</option>
                    <option value="chlorophyll">คลอโรฟิลล์</option>
                    <option value="nh3">แอมโมเนีย (NH₃)</option>
                    <option value="alcl3">อะลูมิเนียมคลอไรด์ (AlCl₃)</option>
                    <option value="ki">โพแทสเซียมไอโอไดด์ (KI)</option>
                    <option value="starch">น้ำแป้ง (Starch)</option>
                    <option value="h2o2">ไฮโดรเจนเปอร์ออกไซด์ (H₂O₂)</option>
                    <option value="fecl3">ไอร์ออน(III)คลอไรด์ (FeCl₃)</option>
                    <option value="kscn">โพแทสเซียมไทโอไซยาเนต (KSCN)</option>
                    <option value="naf">โซเดียมฟลูออไรด์ (NaF)</option>
                    <option value="pbno32">เลด(II)ไนเตรต (Pb(NO₃)₂)</option>
                    <option value="hot_water">น้ำร้อน</option>
                    <option value="clf3">คลอรีนไตรฟลูออไรด์ (ClF₃)</option>
                    <option value="u235">ยูเรเนียม-235 (²³⁵U)</option>
                    <option value="neutron">อนุภาคนิวตรอน (n⁰)</option>
                    <option value="glucose">น้ำตาลกลูโคส (Glucose)</option>
                    <option value="benedict">สารละลายเบเนดิกต์</option>
                    <option value="iodine_sol">สารละลายไอโอดีน (I₂)</option>
                    <option value="protein">โปรตีนไข่ขาว (Albumin)</option>
                </select>
                <label>ปริมาตร (ml)</label>
                <input type="number" id="chemVol" value="300" min="50" max="1000" step="50" style="width: 70px;" aria-label="ปริมาตรสารเคมี">
                <button class="btn" onclick="spawnApparatus()" aria-label="เพิ่มบีกเกอร์">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    วางบีกเกอร์
                </button>
            </div>

            <div class="dash-card">
                <button class="btn btn-danger" onclick="clearLab()" aria-label="ล้างโต๊ะทดลอง">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    ล้างโต๊ะ
                </button>
            </div>
        </div>
    </header>

    <div class="workspace" id="stageContainer">
        <canvas id="labCanvas" role="img" aria-label="พื้นที่จำลองการทดลองเคมี 3 มิติ"></canvas>
        
        <div class="explanation-panel hidden" id="explanationPanel" aria-live="polite">
            <div class="explanation-header">
                <div class="explanation-title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                    <span id="explTitle">ผลปฏิกิริยาเคมี</span>
                </div>
                <button class="close-expl" onclick="hideExplanation()" aria-label="ปิดแผงคำอธิบาย">✕ ปิด</button>
            </div>
            <div class="explanation-body" id="explBody">
                คำอธิบายและสมการเคมีจะแสดงที่นี่
            </div>
        </div>

        <div class="stage-hint">💡 <b>วิธีเล่น:</b> ลากเมาส์ไปซ้าย-ขวาเพื่อเทสารเคมี (บีกเกอร์จะเอียงตามมือคุณ)</div>
    </div>

    <script>
        const canvas = document.getElementById('labCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('stageContainer');

        let apparatusList = [];
        let selectedItem = null;
        let draggingItem = null;
        let connectingSource = null;
        let dragOffsetX = 0;
        let dragOffsetY = 0;
        let currentPointerX = 0;
        let currentPointerY = 0;

        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            const displayWidth = container.clientWidth;
            const displayHeight = container.clientHeight;
            canvas.width = displayWidth * dpr;
            canvas.height = displayHeight * dpr;
            canvas.style.width = displayWidth + 'px';
            canvas.style.height = displayHeight + 'px';
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
        }

        window.addEventListener('resize', resizeCanvas);
        if (document.fonts) { document.fonts.ready.then(drawLab); }

        const chemColors = {

        };

        function spawnApparatus() {
            const chem = document.getElementById('chemSelect').value;
            const vol = parseFloat(document.getElementById('chemVol').value);
            const logicalWidth = container.clientWidth;
            const x = 120 + Math.random() * Math.max(50, (logicalWidth - 240));
            const y = container.clientHeight - 195; // Table height

            apparatusList.push({
                id: 'app_' + Date.now(), type: 'beaker', chem, vol, maxVol: 1000,
                x, y, width: 150, height: 225,
                slosh: 0, sloshV: 0, lastX: x, tilt: 0, pptProgress: 0, facing: 1,
                steamParticles: [], bubbles: [], splashes: [],
                hasPrecipitate: false, hasBubbles: false, isHot: false, isCold: false,
                isExplosion: false, isNuclear: false
            });
            selectedItem = apparatusList[apparatusList.length - 1];
        }

        function clearLab() {
            apparatusList = []; selectedItem = null; connectingSource = null;
            document.getElementById('curriculumSelect').value = "";
            hideExplanation();
        }

        function updateExplanation(title, desc) {
            document.getElementById('explTitle').innerText = title;
            document.getElementById('explBody').innerHTML = desc;
            document.getElementById('explanationPanel').classList.remove('hidden');
        }
        function hideExplanation() { document.getElementById('explanationPanel').classList.add('hidden'); }

        function loadCurriculum() {
            const val = document.getElementById('curriculumSelect').value;
            clearLab();
            document.getElementById('curriculumSelect').value = val;
            if(!val) return;
            
            const logicalWidth = container.clientWidth;
            const cy = container.clientHeight - 195; 
            const sp2 = logicalWidth < 500 ? 100 : 200;
            const sp3 = logicalWidth < 500 ? 80 : 160;

            const addBeaker = (id, chem, vol, x) => {
                apparatusList.push({
                    id, type: 'beaker', chem, vol, maxVol: 1000, x, y: cy, width: 150, height: 225,
                    slosh: 0, sloshV: 0, lastX: x, tilt: 0, pptProgress: 0, facing: 1,
                    steamParticles: [], bubbles: [], splashes: [],
                    hasPrecipitate: false, hasBubbles: false, isHot: false, isCold: false,
                    isExplosion: false, isNuclear: false
                });
            };

            const center = logicalWidth / 2;
            switch(val) {
                case 'neutralization': addBeaker('b1', 'hcl', 300, center - sp2); addBeaker('b2', 'naoh', 300, center + sp2); break;
                case 'precipitation': addBeaker('b1', 'copt', 250, center - sp2); addBeaker('b2', 'naoh', 250, center + sp2); break;
                case 'redox': addBeaker('b1', 'kmno4', 200, center - sp2); addBeaker('b2', 'hcl', 300, center + sp2); break;
                case 'acidmetal': addBeaker('b1', 'zn', 250, center - sp2); addBeaker('b2', 'hcl', 300, center + sp2); break;
                case 'barium': addBeaker('b1', 'bacl2', 250, center - sp2); addBeaker('b2', 'copt', 250, center + sp2); break;
                case 'ammonia': addBeaker('b1', 'nh4cl', 250, center - sp2); addBeaker('b2', 'naoh', 250, center + sp2); break;
                case 'indicator': addBeaker('b1', 'phenol', 250, center - sp2); addBeaker('b2', 'naoh', 250, center + sp2); break;
                case 'chromate': addBeaker('b1', 'chromate', 250, center - sp2); addBeaker('b2', 'hcl', 250, center + sp2); break;
                case 'gascolor': addBeaker('b1', 'cu', 250, center - sp2); addBeaker('b2', 'hno3', 250, center + sp2); break;
                case 'caco3': addBeaker('b1', 'caco3', 250, center - sp2); addBeaker('b2', 'hcl', 300, center + sp2); break;
                case 'exothermic': addBeaker('b1', 'cao', 250, center - sp2); addBeaker('b2', 'water', 250, center + sp2); break;
                case 'endothermic': addBeaker('b1', 'baoh2', 250, center - sp2); addBeaker('b2', 'nh4no3', 250, center + sp2); break;
                case 'saponification': addBeaker('b1', 'oil', 250, center - sp2); addBeaker('b2', 'naoh', 250, center + sp2); break;
                case 'photosynthesis': addBeaker('b1', 'chlorophyll', 250, center - sp2); addBeaker('b2', 'nahco3', 250, center + sp2); break;
                case 'clf3_explosion': addBeaker('b1', 'clf3', 250, center - sp2); addBeaker('b2', 'water', 300, center + sp2); break;
                case 'nuclear_fission': addBeaker('b1', 'u235', 400, center - sp2); addBeaker('b2', 'neutron', 200, center + sp2); break;
                case 'starch_test': addBeaker('b1', 'starch', 250, center - sp2); addBeaker('b2', 'iodine_sol', 250, center + sp2); break;
                case 'titration_reversal': addBeaker('b1', 'naoh', 200, center - sp3*1.5); addBeaker('b2', 'phenol', 200, center); addBeaker('b3', 'hcl', 300, center + sp3*1.5); break;
                case 'amphoteric': addBeaker('b1', 'alcl3', 200, center - sp3*1.5); addBeaker('b2', 'naoh', 150, center); addBeaker('b3', 'naoh', 300, center + sp3*1.5); break;
                case 'copper_complex': addBeaker('b1', 'copt', 200, center - sp3*1.5); addBeaker('b2', 'naoh', 150, center); addBeaker('b3', 'nh3', 300, center + sp3*1.5); break;
                case 'iodine_starch': addBeaker('b1', 'ki', 200, center - sp3*1.5); addBeaker('b2', 'starch', 200, center); addBeaker('b3', 'h2o2', 200, center + sp3*1.5); break;
                case 'fake_blood': addBeaker('b1', 'fecl3', 200, center - sp3*1.5); addBeaker('b2', 'kscn', 200, center); addBeaker('b3', 'naf', 250, center + sp3*1.5); break;
                case 'golden_rain': addBeaker('b1', 'pbno32', 200, center - sp3*1.5); addBeaker('b2', 'ki', 200, center); addBeaker('b3', 'hot_water', 300, center + sp3*1.5); break;
                case 'sugar_test': addBeaker('b1', 'glucose', 200, center - sp3*1.5); addBeaker('b2', 'benedict', 200, center); addBeaker('b3', 'hot_water', 300, center + sp3*1.5); break;
                case 'protein_test': addBeaker('b1', 'protein', 200, center - sp3*1.5); addBeaker('b2', 'naoh', 200, center); addBeaker('b3', 'copt', 200, center + sp3*1.5); break;
            }
        }

        function triggerConnectionReaction(sItem, tItem) {
            if (sItem.id === tItem.id) return;
            let eq = '', explTitle = '', explDesc = '';
            
            // Physics: Generate splattering splashes on the target beaker
            tItem.splashes = Array.from({length: 25}, () => ({
                x: (Math.random() - 0.5) * 80,
                y: - (tItem.vol / tItem.maxVol) * 195,
                vx: (Math.random() - 0.5) * 5,
                vy: -1 - Math.random() * 5,
                life: 1.0, size: 1.5 + Math.random() * 2
            }));

            let combinedVol = Math.min(sItem.vol + tItem.vol, tItem.maxVol);
            tItem.vol = combinedVol;
            sItem.vol = 0;
            
            // Reset state
            tItem.hasPrecipitate = false; tItem.hasBubbles = false;
            tItem.isHot = false; tItem.isCold = false; tItem.isExplosion = false; tItem.isNuclear = false;
            tItem.pptProgress = 0; tItem.bubbles = []; tItem.steamParticles = [];
            
            const isPair = (s, t, a, b) => (s.chem === a && t.chem === b) || (s.chem === b && t.chem === a);

            // Detailed Reactions Engine
            if (isPair(sItem, tItem, 'clf3', 'water') || isPair(sItem, tItem, 'clf3', 'hcl')) {
                eq = 'ClF₃(g) + 2H₂O(l) → 3HF(g) + HClO₂(aq) + ความร้อนสูงมหาศาล';
                tItem.chem = 'explosion_plasma'; tItem.hasBubbles = true; tItem.isHot = true; tItem.isExplosion = true;
                explTitle = '21. ระเบิดรุนแรง ClF₃'; explDesc = `<b>สมการ:</b> ${eq}<br><br><b>ผล:</b> ระเบิดทันที จุดความร้อนสูง 2,400°C`;

                explTitle = '22. นิวเคลียร์ฟิชชัน'; explDesc = `<b>สมการ:</b> ${eq}<br><br><b>ผล:</b> แตกตัวปล่อยพลังงานมหาศาล (Chain Reaction)`;

                eq = 'BaCl₂ + CuSO₄ → CuCl₂ + BaSO₄↓'; tItem.chem = 'copt'; tItem.hasPrecipitate = true;
                explTitle = '5. ตะกอนแบเรียมซัลเฟต'; explDesc = `<b>สมการ:</b> ${eq}`;
            } else if (isPair(sItem, tItem, 'nh4cl', 'naoh')) {
                eq = 'NH₄Cl + NaOH → NaCl + H₂O + NH₃↑'; tItem.chem = 'water'; tItem.hasBubbles = true;
                explTitle = '6. เกิดแก๊สแอมโมเนีย'; explDesc = `<b>สมการ:</b> ${eq}`;
            } else if (isPair(sItem, tItem, 'hcl', 'naoh')) {
                eq = 'HCl + NaOH → NaCl + H₂O'; tItem.chem = 'water'; tItem.hasBubbles = true;
                explTitle = '1. ปฏิกิริยาสะเทิน'; explDesc = `<b>สมการ:</b> ${eq}`;
            } else if (isPair(sItem, tItem, 'kmno4', 'hcl')) {
                eq = '2KMnO₄ + 16HCl → 2KCl + 2MnCl₂ + 5Cl₂↑ + 8H₂O'; tItem.chem = 'water'; tItem.hasBubbles = true;
                explTitle = '3. ปฏิกิริยารีดอกซ์'; explDesc = `<b>สมการ:</b> ${eq}`;
            } else {
                explTitle = 'การผสมสารทั่วไป'; explDesc = `ผสมรวมกันตามสัดส่วนปริมาตร`;
            }
            updateExplanation(explTitle, explDesc);
        }

        function handlePointerDown(e) {
            const rect = canvas.getBoundingClientRect();
            const pointerX = e.clientX - rect.left;
            const pointerY = e.clientY - rect.top;

            const handleHit = apparatusList.slice().reverse().find(item => {
                // If flipped, handle is still at center 0 relative to beaker coordinate
                return Math.hypot(pointerX - item.x, pointerY - (item.y - 235)) <= 55;
            });

            if (handleHit) {
                connectingSource = handleHit;
                return;
            }

            draggingItem = apparatusList.slice().reverse().find(item => {
                return pointerX >= item.x - 90 && pointerX <= item.x + 90 &&
                       pointerY >= item.y - 240 && pointerY <= item.y + 20;
            });

            if (draggingItem) {
                selectedItem = draggingItem;
                dragOffsetX = pointerX - draggingItem.x;
                dragOffsetY = pointerY - draggingItem.y;
            }
        }

        function handlePointerMove(e) {
            const rect = canvas.getBoundingClientRect();
            currentPointerX = e.clientX - rect.left;
            currentPointerY = e.clientY - rect.top;
            if (draggingItem) {
                draggingItem.x = currentPointerX - dragOffsetX;
                draggingItem.y = currentPointerY - dragOffsetY;
            }
        }

        function handlePointerUp(e) {
            if (connectingSource) {
                const rect = canvas.getBoundingClientRect();
                const pointerX = e.clientX - rect.left;
                const pointerY = e.clientY - rect.top;
                const targetItem = apparatusList.find(item => {
                    return item.id !== connectingSource.id &&
                           pointerX >= item.x - 90 && pointerX <= item.x + 90 &&
                           pointerY >= item.y - 240 && pointerY <= item.y + 20;
                });
                if (targetItem) {
                    triggerConnectionReaction(connectingSource, targetItem);
                }
                // Reset tilt when done
                connectingSource = null;
            }
            draggingItem = null;
        }

        canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); canvas.setPointerCapture(e.pointerId); handlePointerDown(e); });
        canvas.addEventListener('pointermove', (e) => { e.preventDefault(); handlePointerMove(e); });
        canvas.addEventListener('pointerup', (e) => { e.preventDefault(); canvas.releasePointerCapture(e.pointerId); handlePointerUp(e); });
        canvas.addEventListener('pointercancel', (e) => { e.preventDefault(); canvas.releasePointerCapture(e.pointerId); handlePointerUp(e); });

        function drawLab() {
            try {
                const displayWidth = container.clientWidth;
                const displayHeight = container.clientHeight;
                ctx.clearRect(0, 0, displayWidth, displayHeight);

                // 1. Draw Raised Sci-Fi Lab Table Background
                const tableSurfaceY = displayHeight - 180; 

                // Back Wall Depth Shadow
                let wallShadow = ctx.createLinearGradient(0, tableSurfaceY - 150, 0, tableSurfaceY);
                wallShadow.addColorStop(0, 'rgba(4, 6, 11, 0)');
                wallShadow.addColorStop(1, 'rgba(0, 0, 0, 0.75)');
                ctx.fillStyle = wallShadow;
                ctx.fillRect(0, tableSurfaceY - 150, displayWidth, 150);

                // Table Top Surface (Thickness)
                ctx.fillStyle = '#1e293b'; 
                ctx.fillRect(0, tableSurfaceY - 8, displayWidth, 8);
                
                // Back Edge Highlight
                ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
                ctx.fillRect(0, tableSurfaceY - 8, displayWidth, 1);

                // Table Front Panel
                let tableFront = ctx.createLinearGradient(0, tableSurfaceY, 0, displayHeight);
                tableFront.addColorStop(0, '#0f172a');
                tableFront.addColorStop(1, '#020617');
                ctx.fillStyle = tableFront;
                ctx.fillRect(0, tableSurfaceY, displayWidth, displayHeight - tableSurfaceY);

                // Neon LED Strip under table edge
                const time = Date.now() * 0.003;
                const neonPulse = 15 + Math.sin(time * 2) * 5;
                ctx.shadowColor = '#0ea5e9';
                ctx.shadowBlur = neonPulse;
                ctx.fillStyle = '#38bdf8';
                ctx.fillRect(0, tableSurfaceY + 2, displayWidth, 2);
                
                // White Core of LED
                ctx.shadowBlur = 5;
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, tableSurfaceY + 2.5, displayWidth, 1);
                ctx.shadowBlur = 0; // Reset

                // Table Segments (Sci-Fi lines)
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
                ctx.lineWidth = 1;
                for (let i = (displayWidth / 2) % 100; i < displayWidth; i += 100) {
                    ctx.beginPath(); ctx.moveTo(i, tableSurfaceY + 4); ctx.lineTo(i, displayHeight); ctx.stroke();
                }

                // 2. Draw Dynamic Pouring Stream (3D Fluid)
                if (connectingSource) {
                    // Update facing direction based on pointer (-1 for right spout, 1 for left spout)
                    connectingSource.facing = currentPointerX > connectingSource.x ? -1 : 1;
                    let targetTilt = connectingSource.facing === -1 ? 0.45 : -0.45;
                    connectingSource.tilt += (targetTilt - connectingSource.tilt) * 0.15; // Smooth tilt

                    // Determine spout coordinates exactly using trigonometry & flip state
                    let lipX = connectingSource.facing === -1 ? 88 : -88;
                    let lipY = -225;
                    let cosT = Math.cos(connectingSource.tilt);
                    let sinT = Math.sin(connectingSource.tilt);
                    let spoutX = connectingSource.x + lipX * cosT - lipY * sinT;
                    let spoutY = connectingSource.y + lipX * sinT + lipY * cosT;

                    const streamColor = chemColors[connectingSource.chem] || '#38bdf8';
                    
                    // Outer Stream Glow
                    ctx.strokeStyle = streamColor;
                    ctx.lineWidth = 8 + Math.sin(time * 5) * 2;
                    ctx.lineCap = 'round';
                    ctx.shadowColor = streamColor;
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    ctx.moveTo(spoutX, spoutY);
                    
                    // Fluid arc to pointer
                    const cpX = spoutX + (currentPointerX - spoutX) * 0.5;
                    const cpY = Math.min(spoutY - 50, currentPointerY - 80);
                    ctx.quadraticCurveTo(cpX, cpY, currentPointerX, currentPointerY);
                    ctx.stroke();

                    // Inner White Core of Stream
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }

                // 3. Render all Beakers
                apparatusList.forEach(item => {
                    // --- Physics Updates ---
                    let vx = item.x - item.lastX;
                    item.lastX = item.x;
                    
                    // Fluid Slosh Physics (Gyroscopic delay)
                    item.sloshV += (vx * -0.005 - item.slosh) * 0.15;
                    item.sloshV *= 0.85; // Damping
                    item.slosh += item.sloshV;
                    item.slosh = Math.max(-0.4, Math.min(0.4, item.slosh));

                    // Return to upright if not pouring
                    if (connectingSource !== item) {
                        item.tilt += (0 - item.tilt) * 0.15;
                    }
                    let flip = item.facing || 1; // 1 = Spout Left, -1 = Spout Right

                    ctx.save();
                    ctx.translate(item.x, item.y);

                    // --- Table Contact Shadows ---
                    ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                    ctx.shadowBlur = 15;
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.9)';
                    ctx.beginPath();
                    ctx.ellipse(0, 10, 68, 8, 0, 0, Math.PI*2);
                    ctx.fill();
                    
                    // Ambient Occlusion Spread
                    ctx.shadowBlur = 35;
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                    ctx.beginPath();
                    ctx.ellipse(0, 12, 85, 14, 0, 0, Math.PI*2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    // --- Glow Effects ---
                    if (item.isExplosion) {
                        ctx.shadowColor = 'rgba(239, 68, 68, 0.95)'; ctx.shadowBlur = 35 + Math.sin(time * 10) * 15;
                    } else if (item.isNuclear) {
                        ctx.shadowColor = 'rgba(34, 197, 94, 0.95)'; ctx.shadowBlur = 35 + Math.sin(time * 8) * 15;
                    } else if (item.isHot) {
                        ctx.shadowColor = 'rgba(244, 63, 94, 0.9)'; ctx.shadowBlur = 25;
                    } else if (item.isCold) {
                        ctx.shadowColor = 'rgba(56, 189, 248, 0.9)'; ctx.shadowBlur = 25;
                    }

                    // Apply Beaker Tilt Rotation
                    ctx.rotate(item.tilt);
                    const isSelected = selectedItem === item;

                    // --- Render Back Glass ---
                    // Back glass doesn't need scaling/flipping since it's symmetrical
                    let innerG = ctx.createLinearGradient(-75, 0, 75, 0);
                    innerG.addColorStop(0, 'rgba(0, 0, 0, 0.45)');
                    innerG.addColorStop(0.2, 'rgba(255, 255, 255, 0.05)');
                    innerG.addColorStop(0.8, 'rgba(255, 255, 255, 0.05)');
                    innerG.addColorStop(1, 'rgba(0, 0, 0, 0.45)');
                    ctx.fillStyle = innerG;
                    ctx.beginPath();
                    ctx.moveTo(-75, -225); ctx.lineTo(-75, 0);
                    ctx.ellipse(0, 0, 75, 12, 0, Math.PI, 0, true);
                    ctx.lineTo(75, -225); ctx.ellipse(0, -225, 75, 12, 0, 0, Math.PI, true);
                    ctx.fill();
                    
                    if (item.isCold) {
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.15)'; ctx.fill(); // Frost condensation inner
                    }
                    ctx.shadowBlur = 0;

                    // --- Render Dynamic Liquid & Physics ---
                    const h = (item.vol / item.maxVol) * 195;
                    // Surface angle compensates for beaker tilt to stay level, plus slosh
                    const surfaceAngle = -item.tilt + item.slosh; 

                    if (h > 0) {
                        ctx.save();
                        // Liquid Clipping Mask
                        ctx.beginPath();
                        ctx.moveTo(-73, -225); ctx.lineTo(-73, 0);
                        ctx.ellipse(0, 0, 73, 11, 0, Math.PI, 0, true);
                        ctx.lineTo(73, -225); ctx.ellipse(0, -225, 73, 11, 0, 0, Math.PI, true);
                        ctx.clip();

                        const yLeft = -h - 73 * Math.tan(surfaceAngle);
                        const yRight = -h + 73 * Math.tan(surfaceAngle);

                        ctx.fillStyle = chemColors[item.chem] || 'rgba(56, 189, 248, 0.55)';
                        
                        // Main Fluid Body
                        ctx.beginPath();
                        ctx.moveTo(-73, yLeft); ctx.lineTo(-73, 0);
                        ctx.ellipse(0, 0, 73, 11, 0, Math.PI, 0, true);
                        ctx.lineTo(73, yRight);
                        ctx.fill();

                        // Caustics & Volumetric Depth
                        let volShadow = ctx.createLinearGradient(-73, 0, 73, 0);
                        volShadow.addColorStop(0, 'rgba(0, 0, 0, 0.4)');
                        volShadow.addColorStop(0.3, 'rgba(255, 255, 255, 0.1)');
                        volShadow.addColorStop(0.7, 'rgba(255, 255, 255, 0.1)');
                        volShadow.addColorStop(1, 'rgba(0, 0, 0, 0.5)');
                        ctx.fillStyle = volShadow;
                        ctx.fill();

                        // Sedimentation Physics Engine
                        if (item.hasPrecipitate) {
                            item.pptProgress = Math.min(1.0, (item.pptProgress || 0) + 0.002);
                            const pProg = item.pptProgress;
                            const isYellow = (item.chem === 'yellow_ppt');
                            const mainC = isYellow ? '250, 204, 21' : '241, 245, 249';
                            
                            // Cloudy suspension fading out
                            const cloudOp = 0.65 * (1.0 - pProg * 0.8);
                            let cGrad = ctx.createLinearGradient(0, 0, 0, -h * 0.9);
                            cGrad.addColorStop(0, `rgba(${mainC}, ${cloudOp})`);
                            cGrad.addColorStop(1, `rgba(${mainC}, 0)`);
                            ctx.fillStyle = cGrad;
                            ctx.fillRect(-75, -h * 1.5, 150, h * 1.5);

                            // Settled Heap on bottom
                            const heapH = (16 + h * 0.2) * Math.pow(pProg, 0.5);
                            ctx.fillStyle = `rgba(${mainC}, 0.9)`;
                            ctx.beginPath();
                            ctx.ellipse(0, 0, 72, 10, 0, Math.PI, 0, true);
                            for (let x = 72; x >= -72; x -= 6) {
                                ctx.lineTo(x, -heapH + (Math.sin(x*0.12)*4 + Math.cos(x*0.2)*3));
                            }
                            ctx.fill();
                        }

                        // Rising Bubbles Engine
                        if (item.hasBubbles) {
                            if (!item.bubbles || item.bubbles.length === 0) {
                                item.bubbles = Array.from({length: 12}, () => ({
                                    x: (Math.random() - 0.5) * 110, y: -Math.random() * h,
                                    size: 1.5 + Math.random() * 3, speed: 1.5 + Math.random() * 2
                                }));
                            }
                            let upX = Math.sin(item.tilt);
                            let upY = -Math.cos(item.tilt);
                            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                            item.bubbles.forEach((b, i) => {
                                b.x += upX * b.speed + Math.sin(time*5 + i)*0.5*Math.cos(item.tilt);
                                b.y += upY * b.speed;
                                if (b.y < -h + 5) { // Reset at surface
                                    b.y = 0; b.x = (Math.random() - 0.5) * 110;
                                }
                                ctx.beginPath(); ctx.arc(b.x, b.y, b.size, 0, Math.PI*2); ctx.fill();
                                // Bubble glossy highlight
                                ctx.fillStyle = 'rgba(255, 255, 255, 1)';
                                ctx.beginPath(); ctx.arc(b.x - b.size*0.3, b.y - b.size*0.3, b.size*0.25, 0, Math.PI*2); ctx.fill();
                                ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                            });
                        }

                        // Surface Meniscus
                        ctx.beginPath();
                        ctx.ellipse(0, -h, 73, 11, surfaceAngle, 0, Math.PI * 2);
                        ctx.fillStyle = chemColors[item.chem] || 'rgba(56, 189, 248, 0.55)';
                        ctx.fill();
                        
                        // Surface Highlights & Tension
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.25)'; ctx.fill();
                        ctx.lineWidth = 1.2; ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)'; ctx.stroke();
                        ctx.restore();

                        // Splatter / Splash Physics
                        if (item.splashes && item.splashes.length > 0) {
                            ctx.fillStyle = chemColors[item.chem] || 'rgba(255, 255, 255, 0.8)';
                            for (let i = item.splashes.length - 1; i >= 0; i--) {
                                let sp = item.splashes[i];
                                sp.vy += 0.4; // gravity
                                sp.x += sp.vx; sp.y += sp.vy; sp.life -= 0.02;
                                if (sp.life <= 0 || sp.y > -h + 5) item.splashes.splice(i, 1);
                                else {
                                    ctx.beginPath(); ctx.arc(sp.x, sp.y, sp.size, 0, Math.PI*2); ctx.fill();
                                }
                            }
                        }
                    }

                    // --- Steam / Frost Engine ---
                    if ((item.isHot || item.isExplosion || item.isCold) && h > 0) {
                        if (Math.random() < 0.4) {
                            item.steamParticles.push({
                                x: (Math.random() - 0.5) * 80, y: -h,
                                vx: (Math.random() - 0.5) * 1.5,
                                vy: item.isCold ? (0.5 + Math.random()) : (-1 - Math.random() * 2), // cold sinks, hot rises
                                life: 1.0, size: 4 + Math.random() * 8
                            });
                        }
                    }
                    for (let i = item.steamParticles.length - 1; i >= 0; i--) {
                        let p = item.steamParticles[i];
                        p.x += p.vx; p.y += p.vy; p.life -= 0.015; p.size += 0.3;
                        if (p.life <= 0) item.steamParticles.splice(i, 1);
                        else {
                            let sColor = item.isCold ? `rgba(200, 240, 255, ${p.life*0.2})` : `rgba(255, 255, 255, ${p.life*0.25})`;
                            ctx.fillStyle = sColor;
                            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
                        }
                    }

                    // --- Intelligent Render: Flipping the Beaker Spout & Front Glass ---
                    ctx.save();
                    ctx.scale(flip, 1); // Flip everything horizontally based on 'facing'

                    // Fresnel Glass Reflection (Front)
                    let glassShine = ctx.createLinearGradient(-75, 0, 75, 0);
                    glassShine.addColorStop(0, 'rgba(255,255,255,0.0)');
                    glassShine.addColorStop(0.08, 'rgba(255,255,255,0.4)');
                    glassShine.addColorStop(0.15, 'rgba(255,255,255,0.0)');
                    glassShine.addColorStop(0.9, 'rgba(255,255,255,0.0)');
                    glassShine.addColorStop(0.97, 'rgba(255,255,255,0.2)');
                    glassShine.addColorStop(1, 'rgba(255,255,255,0.0)');
                    ctx.fillStyle = glassShine;
                    ctx.beginPath();
                    ctx.moveTo(-75, -225); ctx.lineTo(-75, 0);
                    ctx.ellipse(0, 0, 75, 12, 0, Math.PI, 0, true);
                    ctx.lineTo(75, -225); ctx.ellipse(0, -225, 75, 12, 0, 0, Math.PI, true);
                    ctx.fill();

                    // Edge Outline
                    ctx.strokeStyle = isSelected ? '#38bdf8' : 'rgba(148, 163, 184, 0.75)';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(-75, -215); ctx.lineTo(-75, 0); ctx.ellipse(0, 0, 75, 12, 0, Math.PI, 0, true); ctx.lineTo(75, -225);
                    ctx.stroke();

                    // Rim & Spout (Now on the left side -88 natively, but flip scale handles right automatically)
                    ctx.beginPath();
                    ctx.moveTo(75, -225);
                    ctx.bezierCurveTo(75, -231.6, 41.4, -237, 0, -237);
                    ctx.bezierCurveTo(-45, -237, -75, -233, -88, -225); // Spout tip
                    ctx.bezierCurveTo(-75, -217, -45, -213, 0, -213);
                    ctx.bezierCurveTo(41.4, -213, 75, -218.4, 75, -225);
                    ctx.closePath();
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.08)'; ctx.fill(); ctx.stroke();

                    // Spout Crease Highlight
                    ctx.beginPath(); ctx.moveTo(-88, -225); ctx.quadraticCurveTo(-78, -223, -75, -215);
                    ctx.lineWidth = 1.5; ctx.strokeStyle = isSelected ? 'rgba(56, 189, 248, 0.6)' : 'rgba(255, 255, 255, 0.3)'; ctx.stroke();

                    // Drag Handle Ring
                    ctx.fillStyle = isSelected ? '#38bdf8' : 'rgba(203, 213, 225, 0.9)';
                    ctx.beginPath(); ctx.arc(0, -235, 10, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2.5; ctx.stroke();

                    ctx.restore(); // Restore flip scale so text isn't mirrored!

                    // --- Volume Scale Marks ---
                    ctx.fillStyle = 'rgba(148, 163, 184, 0.9)';
                    ctx.strokeStyle = 'rgba(148, 163, 184, 0.9)';
                    ctx.lineWidth = 1.5;
                    ctx.font = '10px "Prompt", sans-serif'; ctx.textBaseline = 'middle';
                    for (let mark = 200; mark <= 1000; mark += 200) {
                        let markY = - (mark / 1000) * 195;
                        // Determine scale side based on flip (Opposite of spout)
                        let startX = 35 * flip;
                        let endX = 50 * flip;
                        let txtX = 54 * flip;
                        
                        ctx.beginPath(); ctx.moveTo(startX, markY); ctx.lineTo(endX, markY); ctx.stroke();
                        ctx.textAlign = flip === 1 ? 'left' : 'right'; // Readability
                        ctx.fillText(mark, txtX, markY);
                    }

                    // --- Smart Thermometer UI ---
                    if (item.isHot || item.isCold) {
                        let tColor = item.isHot ? '#ef4444' : '#38bdf8';
                        let tLevel = item.isHot ? -35 : -10; 
                        
                        ctx.save();
                        ctx.rotate(-item.tilt); // Stay upright
                        let tX = 95 * flip; // Position based on flip
                        ctx.translate(tX, -120);

                        ctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        if(ctx.roundRect) ctx.roundRect(-8, -45, 16, 60, 8);
                        else ctx.rect(-8, -45, 16, 60);
                        ctx.fill(); ctx.stroke();

                        ctx.fillStyle = tColor;
                        ctx.beginPath(); ctx.arc(0, 5, 5, 0, Math.PI*2); ctx.fill();
                        ctx.fillRect(-2, 0, 4, tLevel);
                        
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                        ctx.fillRect(4, -10, 3, 1); ctx.fillRect(4, -20, 3, 1); ctx.fillRect(4, -30, 3, 1);
                        ctx.restore();
                    }

                    // --- Floating Glassmorphism Label Badge ---
                    ctx.save();
                    ctx.rotate(-item.tilt); // Keep label perfectly horizontal always
                    
                    let dName = chemNames[item.chem] || item.chem;
                    let hasF = dName.includes(' (');
                    let nText = hasF ? dName.split(' (')[0] : dName;
                    let fText = hasF ? '(' + dName.split(' (')[1] : '';
                    let vText = `ปริมาตร: ${item.vol} มล.`;

                    const M_W = 130; 
                    ctx.font = '600 11px "Prompt", sans-serif'; let nW = Math.min(ctx.measureText(nText).width, M_W);
                    ctx.font = '400 10px "Prompt", sans-serif'; let fW = hasF ? Math.min(ctx.measureText(fText).width, M_W) : 0;
                    let vW = Math.min(ctx.measureText(vText).width, M_W);

                    let bW = Math.max(120, Math.max(nW, fW, vW) + 24); 
                    let bH = hasF ? 62 : 48; let bX = -bW / 2; let bY = -145; // Centered

                    ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
                    ctx.strokeStyle = isSelected ? 'rgba(56, 189, 248, 0.8)' : 'rgba(255, 255, 255, 0.25)';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    if(ctx.roundRect) ctx.roundRect(bX, bY, bW, bH, 8);
                    else ctx.rect(bX, bY, bW, bH);
                    ctx.fill(); ctx.stroke();

                    // Text Rendering
                    ctx.shadowColor = 'rgba(0, 0, 0, 0.9)'; ctx.shadowBlur = 4;
                    ctx.textAlign = 'center'; ctx.textBaseline = 'top';

                    if (hasF) {
                        ctx.font = '600 11px "Prompt", sans-serif'; ctx.fillStyle = '#ffffff'; ctx.fillText(nText, 0, bY + 8, M_W);
                        ctx.font = '400 10px "Prompt", sans-serif'; ctx.fillStyle = '#7dd3fc'; ctx.fillText(fText, 0, bY + 25, M_W);
                        ctx.font = '400 9.5px "Prompt", sans-serif'; ctx.fillStyle = '#cbd5e1'; ctx.fillText(vText, 0, bY + 42, M_W);
                    } else {
                        ctx.font = '600 11.5px "Prompt", sans-serif'; ctx.fillStyle = '#ffffff'; ctx.fillText(dName, 0, bY + 10, M_W);
                        ctx.font = '400 9.5px "Prompt", sans-serif'; ctx.fillStyle = '#cbd5e1'; ctx.fillText(vText, 0, bY + 28, M_W);
                    }
                    ctx.restore();
                    ctx.restore(); // Complete beaker transform restore
                });

            } catch (err) {
                console.error("Render Error:", err);
            }
            requestAnimationFrame(drawLab);
        }

        // Start App
        resizeCanvas();
        requestAnimationFrame(drawLab);
    </script>
</body>
</html>
