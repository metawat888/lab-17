<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Virtual 2D Chemistry Lab Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            background: #060911;
            color: #f8fafc;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            overscroll-behavior: none;
        }

        .top-dashboard {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            z-index: 20;
            flex-shrink: 0;
            min-height: 64px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: thin;
            scrollbar-color: #334155 transparent;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .top-dashboard::-webkit-scrollbar { height: 4px; }
        .top-dashboard::-webkit-scrollbar-track { background: transparent; }
        .top-dashboard::-webkit-scrollbar-thumb { background-color: #334155; border-radius: 2px; }

        .logo {
            font-size: 1.1rem;
            font-weight: 700;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-right: 10px;
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dash-card {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.05);
        }

        label {
            font-size: 0.75rem;
            color: #94a3b8;
            font-weight: 500;
        }

        select, input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
            transition: all 0.2s;
        }

        select:focus, input:focus {
            border-color: #38bdf8;
            background: rgba(15, 23, 42, 0.9);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        .btn {
            background: linear-gradient(135deg, #0ea5e9, #6366f1);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
        }

        .btn:hover, .btn:active { transform: translateY(-1px); filter: brightness(1.1); }
        .btn-danger {
            background: linear-gradient(135deg, #f43f5e, #e11d48);
            box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3);
        }

        .workspace {
            position: relative;
            flex: 1;
            background: radial-gradient(circle at center, #1e293b 0%, #060911 100%);
            background-image: 
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px),
                radial-gradient(circle at center, #1e293b 0%, #060911 100%);
            background-size: 40px 40px, 40px 40px, 100% 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        #labCanvas {
            position: absolute;
            left: 0; top: 0;
            width: 100%; height: 100%;
            cursor: default;
            touch-action: none;
        }

        .explanation-panel {
            position: absolute;
            top: 20px; right: 20px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 12px;
            padding: 20px;
            width: 400px;
            max-width: calc(100vw - 40px);
            box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.8);
            z-index: 10;
            pointer-events: auto;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .explanation-panel.hidden {
            opacity: 0;
            transform: translateY(-16px);
            pointer-events: none;
        }

        .explanation-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .explanation-title {
            font-size: 1rem;
            font-weight: 700;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .close-expl {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .close-expl:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }

        .explanation-body {
            font-size: 0.85rem;
            color: #cbd5e1;
            line-height: 1.6;
        }

        .stage-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 0.85rem;
            color: #e2e8f0;
            pointer-events: none;
            z-index: 5;
            white-space: nowrap;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            animation: floatHint 3s ease-in-out infinite;
        }

        @keyframes floatHint {
            0%, 100% { transform: translate(-50%, 0); box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
            50% { transform: translate(-50%, -6px); box-shadow: 0 14px 28px rgba(0,0,0,0.4); border-color: rgba(56, 189, 248, 0.6); }
        }
    </style>
</head>
<body>
    <header class="top-dashboard">
        <div class="logo">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 3h6v3H9z"/><path d="M10 6v5l-4.5 8.5A1 1 0 0 0 6.4 21h11.2a1 1 0 0 0 .9-1.5L14 11V6"/></svg>
            ChemLab Pro

        <div class="controls-group">
            <div class="dash-card">
                <label>บทเรียน</label>

                    <option value="neutralization">1. ปฏิกิริยาสะเทิน (HCl + NaOH)</option>
                    <option value="precipitation">2. การเกิดตะกอน (CuSO₄ + NaOH)</option>
                    <option value="redox">3. ปฏิกิริยารีดอกซ์ (KMnO₄ + HCl)</option>
                    <option value="acidmetal">4. ปฏิกิริยากรดกับโลหะ (HCl + Zn)</option>
                    <option value="barium">5. การเกิดตะกอนซัลเฟต (BaCl₂ + CuSO₄)</option>
                    <option value="ammonia">6. ปฏิกิริยาเกิดแก๊สแอมโมเนีย (NH₄Cl + NaOH)</option>
                    <option value="indicator">7. การเปลี่ยนสีอินดิเคเตอร์ (NaOH + Phenol)</option>
                    <option value="chromate">8. สมดุลไอออนโครเมต (K₂CrO₄ + HCl)</option>
                    <option value="gascolor">9. ปฏิกิริยาเปลี่ยนสีพร้อมฟองแก๊ส (Cu + HNO₃)</option>
                    <option value="caco3">10. ปฏิกิริยากรดกับหินปูน (HCl + CaCO₃)</option>
                    <option value="exothermic">11. ปฏิกิริยาคายความร้อน (CaO + H₂O)</option>
                    <option value="endothermic">12. ปฏิกิริยาดูดความร้อน (Ba(OH)₂ + NH₄NO₃)</option>

                    <option value="photosynthesis">14. การสังเคราะห์ด้วยแสง (คลอโรฟิลล์ + CO₂)</option>
                    <option value="titration_reversal">15. สีอินดิเคเตอร์กลับไปมา (NaOH + Phenol + HCl)</option>
                    <option value="amphoteric">16. ตะกอนแอมโฟเทอริก (AlCl₃ + NaOH + NaOH)</option>
                    <option value="copper_complex">17. สารเชิงซ้อนสีน้ำเงิน (CuSO₄ + NaOH + NH₃)</option>
                    <option value="iodine_starch">18. ปฏิกิริยาแป้ง-ไอโอดีน (KI + Starch + H₂O₂)</option>
                    <option value="fake_blood">19. เลือดเทียมและการล้างสี (FeCl₃ + KSCN + NaF)</option>
                    <option value="golden_rain">20. ฝนทองคำ (Pb(NO₃)₂ + KI + น้ำร้อน)</option>
                    <option value="clf3_explosion">21. การระเบิดรุนแรงของ ClF₃ (ClF₃ + H₂O)</option>
                    <option value="nuclear_fission">22. จำลองปฏิกิริยานิวเคลียร์ฟิชชัน (²³⁵U + n)</option>
                    <option value="sugar_test">23. ทดสอบน้ำตาล (Glucose + Benedict + น้ำร้อน)</option>
                    <option value="starch_test">24. ทดสอบแป้ง (Starch + Iodine)</option>
                    <option value="protein_test">25. ทดสอบโปรตีน (Protein + NaOH + CuSO₄)</option>
                    <option value="elephant_toothpaste">26. ยาสีฟันช้าง (H₂O₂ + สบู่ + KI)</option>
                    <option value="blue_bottle">27. ขวดสีน้ำเงิน (Methylene Blue + O₂)</option>
                    <option value="magic_milk">28. นมมหัศจรรย์ (Milk + สบู่)</option>
                    <option value="al_cucl2">29. อะลูมิเนียมกับคอปเปอร์คลอไรด์ (Al + CuCl₂)</option>
                    <option value="silver_mirror">30. กระจกเงิน (Tollens + Glucose)</option>
                </select>
            </div>

            <div class="dash-card">
                <label>สารเคมี</label>
                <select id="chemSelect" style="width: 220px;">
                    <option value="water">น้ำกลั่น (H₂O)</option>
                    <option value="hcl">กรดไฮโดรคลอริก (HCl)</option>
                    <option value="naoh">โซเดียมไฮดรอกไซด์ (NaOH)</option>
                    <option value="copt">คอปเปอร์ซัลเฟต (CuSO₄)</option>
                    <option value="kmno4">ด่างทับทิม (KMnO₄)</option>
                    <option value="bacl2">แบเรียมคลอไรด์ (BaCl₂)</option>
                    <option value="nh4cl">แอมโมเนียมคลอไรด์ (NH₄Cl)</option>
                    <option value="zn">โลหะสังกะสี (Zn)</option>
                    <option value="phenol">ฟีนอลฟทาลีน</option>
                    <option value="chromate">โพแทสเซียมโครเมต (K₂CrO₄)</option>
                    <option value="cu">โลหะทองแดง (Cu)</option>
                    <option value="hno3">กรดไนตริก (HNO₃)</option>
                    <option value="caco3">หินปูน (CaCO₃)</option>
                    <option value="cao">แคลเซียมออกไซด์ (CaO)</option>
                    <option value="baoh2">แบเรียมไฮดรอกไซด์ (Ba(OH)₂)</option>
                    <option value="nh4no3">แอมโมเนียมไนเตรต (NH₄NO₃)</option>
                    <option value="oil">น้ำมันพืช (Lipid)</option>
                    <option value="nahco3">โซเดียมไบคาร์บอเนต (NaHCO₃)</option>
                    <option value="chlorophyll">คลอโรฟิลล์</option>
                    <option value="nh3">แอมโมเนีย (NH₃)</option>
                    <option value="alcl3">อะลูมิเนียมคลอไรด์ (AlCl₃)</option>
                    <option value="ki">โพแทสเซียมไอโอไดด์ (KI)</option>
                    <option value="starch">น้ำแป้ง (Starch)</option>
                    <option value="h2o2">ไฮโดรเจนเปอร์ออกไซด์ (H₂O₂)</option>
                    <option value="fecl3">ไอร์ออน(III)คลอไรด์ (FeCl₃)</option>

                    <option value="pbno32">เลด(II)ไนเตรต (Pb(NO₃)₂)</option>
                    <option value="hot_water">น้ำร้อน</option>
                    <option value="clf3">คลอรีนไตรฟลูออไรด์ (ClF₃)</option>
                    <option value="u235">ยูเรเนียม-235 (²³⁵U)</option>
                    <option value="neutron">อนุภาคนิวตรอน (n⁰)</option>
                    <option value="glucose">น้ำตาลกลูโคส (Glucose)</option>
                    <option value="benedict">สารละลายเบเนดิกต์</option>
                    <option value="iodine_sol">สารละลายไอโอดีน (I₂)</option>
                    <option value="protein">โปรตีนไข่ขาว (Albumin)</option>
                    <option value="soap_liquid">น้ำยาล้างจาน/สบู่</option>
                    <option value="methylene_blue_colorless">Methylene Blue (ไม่มีสี)</option>
                    <option value="oxygen_gas">แก๊สออกซิเจน (O₂)</option>
                    <option value="milk_color">นมสดหยดสี</option>
                    <option value="al_foil">แผ่นอะลูมิเนียม (Al)</option>
                    <option value="cucl2">คอปเปอร์(II)คลอไรด์ (CuCl₂)</option>
                    <option value="tollens">สารละลายทอลเลนส์ (Tollens)</option>
                </select>
                <label>ปริมาตร</label>
                <input type="number" id="chemVol" value="300" min="50" max="1000" step="50" style="width: 60px;">
                <button class="btn" onclick="spawnApparatus()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    วางบีกเกอร์
                </button>
            </div>

            <div class="dash-card">
                <button class="btn btn-danger" onclick="clearLab()">ล้างโต๊ะ</button>
            </div>
        </div>
    </header>

    <div class="workspace" id="stageContainer">
        <canvas id="labCanvas" role="img" aria-label="Interactive Chemistry Simulation Canvas"></canvas>
        
        <div class="explanation-panel hidden" id="explanationPanel">
            <div class="explanation-header">
                <div class="explanation-title">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                    <span id="explTitle">ผลปฏิกิริยาเคมี</span>
                </div>
                <button class="close-expl" onclick="hideExplanation()">✕ ปิด</button>
            </div>
            <div class="explanation-body" id="explBody">
                คำอธิบายและสมการเคมีจะแสดงที่นี่หลังจากเกิดปฏิกิริยาผสมสารสำเร็จ
            </div>
        </div>

        <div class="stage-hint">💡 <b>วิธีเล่น:</b> ลากเมาส์ไปซ้าย-ขวาเพื่อเทสารเคมี (บีกเกอร์จะพลิกและเอียงตามมือคุณ)</div>
    </div>

    <script>
        const canvas = document.getElementById('labCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('stageContainer');

        let apparatusList = [];
        let selectedItem = null;
        let draggingItem = null;
        let connectingSource = null;
        let dragOffsetX = 0;
        let dragOffsetY = 0;
        let currentPointerX = 0;
        let currentPointerY = 0;

        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            const displayWidth = container.clientWidth;
            const displayHeight = container.clientHeight;

            canvas.width = displayWidth * dpr;
            canvas.height = displayHeight * dpr;
            canvas.style.width = displayWidth + 'px';
            canvas.style.height = displayHeight + 'px';

            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resizeCanvas);

        if (document.fonts) {
            document.fonts.ready.then(() => drawLab());
        }

        const chemColors = {

        function triggerConnectionReaction(sourceItem, targetItem) {
            if (sourceItem.id === targetItem.id) return;
            if (sourceItem.vol <= 0) return; // ไม่สามารถเทจากบีกเกอร์เปล่าได้

            let eq = '';
            let explTitle = '';
            let explDesc = '';
            
            // 1. ถ่ายเทสารใส่บีกเกอร์เปล่า (ไม่มีปฏิกิริยาเคมี แค่ย้ายของเหลว)
            if (targetItem.vol <= 0) {
                let transferVol = Math.min(sourceItem.vol, targetItem.maxVol);
                targetItem.vol = transferVol;
                sourceItem.vol -= transferVol;

                // ย้ายชนิดสารและคุณสมบัติต่างๆ ไปยังบีกเกอร์เปล่า
                targetItem.chem = sourceItem.chem;
                targetItem.hasPrecipitate = sourceItem.hasPrecipitate;
                targetItem.hasBubbles = sourceItem.hasBubbles;
                targetItem.isHot = sourceItem.isHot;
                targetItem.isCold = sourceItem.isCold;
                targetItem.isExplosion = sourceItem.isExplosion;
                targetItem.isNuclear = sourceItem.isNuclear;
                targetItem.splash = 0.5;

                explTitle = 'การถ่ายเทสารเคมี';
                explDesc = `<b>ผลการทำงาน:</b> เทสารลงในภาชนะเปล่า (ไม่เกิดปฏิกิริยา)`;
                updateExplanation(explTitle, explDesc);
                return; // หยุดการทำงาน ไม่ต้องเช็คปฏิกิริยาเคมี
            }

            // 2. การผสมสาร (คำนวณปฏิกิริยาเคมี)
            let totalVol = sourceItem.vol + targetItem.vol;
            let combinedVol = Math.min(totalVol, targetItem.maxVol);
            let leftoverVol = Math.max(0, totalVol - targetItem.maxVol); // คำนวณสารที่เหลือหากล้นบีกเกอร์
            
            targetItem.vol = combinedVol;
            sourceItem.vol = leftoverVol;
            
            targetItem.hasPrecipitate = false;
            targetItem.hasBubbles = false;
            targetItem.isHot = false;
            targetItem.isCold = false;
            targetItem.isExplosion = false;
            targetItem.isNuclear = false;
            
            targetItem.splash = 0.5;

            const isPair = (s, t, a, b) => (s.chem === a && t.chem === b) || (s.chem === b && t.chem === a);

            // -- NEW EXPERIMENTS (26-30) --
            if (isPair(sourceItem, targetItem, 'h2o2', 'soap_liquid')) {
                targetItem.chem = 'h2o2';
                explTitle = '26. ยาสีฟันช้าง (ขั้น 1/2)';
                explDesc = `<b>ผลการทดลอง:</b> ผสมไฮโดรเจนเปอร์ออกไซด์กับสบู่ ยังไม่มีปฏิกิริยา<br><br><i>👉 ขั้นต่อไป: เติมตัวเร่งปฏิกิริยา (KI)</i>`;
            } else if (isPair(sourceItem, targetItem, 'h2o2', 'ki') || isPair(sourceItem, targetItem, 'soap_liquid', 'ki')) { 
                 eq = '2H₂O₂ (aq) → 2H₂O (l) + O₂ (g)';
                 targetItem.chem = 'elephant_foam';
                 targetItem.hasBubbles = true;
                 targetItem.isHot = true;
                 explTitle = '26. ยาสีฟันช้าง (Elephant Toothpaste)';
                 explDesc = `<b>ผลการทดลอง:</b> โพแทสเซียมไอโอไดด์ (KI) ทำหน้าที่เร่งปฏิกิริยา ทำให้เกิดแก๊ส O₂ อย่างรวดเร็ว สบู่ดักจับแก๊สไว้กลายเป็นฟองโฟมปริมาณมหาศาลและคายความร้อน`;
                 confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 }, colors: ['#fde68a', '#ffffff'] });
            } else if (isPair(sourceItem, targetItem, 'methylene_blue_colorless', 'oxygen_gas')) {
                eq = 'Methylene Blue (ไม่มีสี) + O₂ → Methylene Blue (สีน้ำเงิน)';

        function handlePointerDown(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const pointerX = clientX - rect.left;
            const pointerY = clientY - rect.top;

            // เช็คว่ากดโดนหูหิ้วแก้ว (Handle) สำหรับลากเทหรือไม่
            const handleHit = apparatusList.slice().reverse().find(item => {
                const handleX = item.x;
                const handleY = item.y - 235;
                return Math.hypot(pointerX - handleX, pointerY - handleY) <= 50;
            });

            if (handleHit) {
                connectingSource = handleHit;
                return;
            }

            // เช็คว่ากดโดนตัวขวดบีกเกอร์หรือป้ายชื่อที่อยู่ด้านล่างหรือไม่ (ปรับ hitbox รองรับป้ายถึง y + 95)
            draggingItem = apparatusList.slice().reverse().find(item => {
                return pointerX >= item.x - 90 && pointerX <= item.x + 90 &&
                       pointerY >= item.y - 240 && pointerY <= item.y + 95;
            });

            if (draggingItem) {
                selectedItem = draggingItem;
                dragOffsetX = pointerX - draggingItem.x;
                dragOffsetY = pointerY - draggingItem.y;
            }
        }

        function handlePointerMove(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            currentPointerX = clientX - rect.left;
            currentPointerY = clientY - rect.top;

            if (draggingItem) {
                draggingItem.x = currentPointerX - dragOffsetX;
                draggingItem.y = currentPointerY - dragOffsetY;
            }
        }

        function handlePointerUp(clientX, clientY) {
            if (connectingSource) {
                const rect = canvas.getBoundingClientRect();
                const pointerX = clientX - rect.left;
                const pointerY = clientY - rect.top;

                const targetItem = apparatusList.find(item => {
                    return item.id !== connectingSource.id &&
                           pointerX >= item.x - 90 && pointerX <= item.x + 90 &&
                           pointerY >= item.y - 240 && pointerY <= item.y + 95;
                });

                if (targetItem) {
                    triggerConnectionReaction(connectingSource, targetItem);
                }
                connectingSource = null;
            }
            draggingItem = null;
        }

        canvas.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            canvas.setPointerCapture(e.pointerId);
            handlePointerDown(e.clientX, e.clientY);
        });
        canvas.addEventListener('pointermove', (e) => {
            e.preventDefault();
            handlePointerMove(e.clientX, e.clientY);
        });
        canvas.addEventListener('pointerup', (e) => {
            e.preventDefault();
            canvas.releasePointerCapture(e.pointerId);
            handlePointerUp(e.clientX, e.clientY);
        });
        canvas.addEventListener('pointercancel', (e) => {
            e.preventDefault();
            canvas.releasePointerCapture(e.pointerId);
            handlePointerUp(e.clientX, e.clientY);
        });

        function drawLab() {
            const displayWidth = container.clientWidth;
            const displayHeight = container.clientHeight;
            ctx.clearRect(0, 0, displayWidth, displayHeight);

            // ความสูงของหน้าโต๊ะ (Table Top) ลอยสูงขึ้นมารับตัวแก้ว
            const tableSurfaceY = displayHeight - 180; 

            // วาดแสงสะท้อนจากโต๊ะขึ้นไปบนฉากหลัง
            let glow = ctx.createLinearGradient(0, tableSurfaceY - 40, 0, tableSurfaceY);
            glow.addColorStop(0, 'rgba(56, 189, 248, 0)');
            glow.addColorStop(1, 'rgba(56, 189, 248, 0.15)');
            ctx.fillStyle = glow;
            ctx.fillRect(0, tableSurfaceY - 40, displayWidth, 40);

            // วาดเส้นขอบไฟ Neon โต๊ะ
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 3;
            ctx.shadowColor = '#38bdf8';
            ctx.shadowBlur = 15;
            ctx.beginPath(); ctx.moveTo(0, tableSurfaceY); ctx.lineTo(displayWidth, tableSurfaceY); ctx.stroke();
            ctx.shadowBlur = 0;

            // วาดความหนาของแผ่นโต๊ะ (Table Top Thickness)
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, tableSurfaceY, displayWidth, 15);

            // วาดแผงหน้าโต๊ะทอดยาวลงพื้น
            let tableFront = ctx.createLinearGradient(0, tableSurfaceY + 15, 0, displayHeight);
            tableFront.addColorStop(0, '#060911');
            tableFront.addColorStop(1, '#020408');
            ctx.fillStyle = tableFront;
            ctx.fillRect(0, tableSurfaceY + 15, displayWidth, displayHeight - (tableSurfaceY + 15));

            if (connectingSource) {
                const streamColor = chemColors[connectingSource.chem] || '#38bdf8';
                const isDragLeft = currentPointerX < connectingSource.x;
                const flip = isDragLeft ? 1 : -1; 
                
                let targetAngle = (currentPointerX - connectingSource.x) * 0.003;
                targetAngle = Math.min(Math.max(targetAngle, -0.6), 0.6);

                const localSpoutX = -88 * flip; 
                const localSpoutY = -225;

                const cosA = Math.cos(targetAngle);
                const sinA = Math.sin(targetAngle);
                const trueSpoutX = connectingSource.x + (localSpoutX * cosA) - (localSpoutY * sinA);
                const trueSpoutY = connectingSource.y + (localSpoutX * sinA) + (localSpoutY * cosA);

                ctx.strokeStyle = streamColor;
                ctx.lineWidth = 8 + Math.sin(Date.now() * 0.01) * 2;
                ctx.lineCap = 'round';
                ctx.shadowColor = streamColor;
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.moveTo(trueSpoutX, trueSpoutY);
                
                const midX = trueSpoutX + ((currentPointerX - trueSpoutX) * 0.4);
                const midY = trueSpoutY - Math.abs(currentPointerX - trueSpoutX) * 0.1;
                ctx.quadraticCurveTo(midX, midY, currentPointerX, currentPointerY);
                ctx.stroke();
                
                ctx.strokeStyle = 'rgba(255,255,255,0.4)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(trueSpoutX, trueSpoutY);
                ctx.quadraticCurveTo(midX, midY, currentPointerX, currentPointerY);
                ctx.stroke();
                ctx.shadowBlur = 0; 
            }

            const time = Date.now() * 0.003;

            apparatusList.forEach(item => {
                if (item.slosh === undefined) {
                    item.slosh = 0; item.sloshV = 0; item.lastX = item.x;
                    item.steamParticles = []; item.splash = 0; item.sedimentTime = 0;
                }

                let vx = item.x - item.lastX;
                item.lastX = item.x;
                item.sloshV += (vx * -0.015 - item.slosh) * 0.12; 
                item.sloshV *= 0.85; 
                item.slosh += item.sloshV;
                item.slosh = Math.max(-0.5, Math.min(0.5, item.slosh));
                
                if (item.splash > 0) item.splash -= 0.02;
                if (item.hasPrecipitate) item.sedimentTime += 0.01; else item.sedimentTime = 0;

                const yDistToTable = Math.abs(item.y - (tableSurfaceY + 15));
                if (yDistToTable < 30) { 
                    const shadowScale = 1 - (yDistToTable / 30);
                    ctx.fillStyle = `rgba(0, 0, 0, ${0.8 * shadowScale})`;
                    ctx.beginPath(); ctx.ellipse(item.x, item.y + 4, 75, 12, 0, 0, Math.PI*2); ctx.fill();
                    
                    ctx.fillStyle = `rgba(0, 0, 0, ${0.4 * shadowScale})`;
                    ctx.beginPath(); ctx.ellipse(item.x, item.y + 4, 110, 25, 0, 0, Math.PI*2); ctx.fill();
                }

                ctx.save();
                ctx.translate(item.x, item.y);

                const isSelected = selectedItem === item;
                const isPouring = (connectingSource === item);
                
                let flip = 1;
                let targetAngle = 0;
                if (isPouring) {
                    flip = currentPointerX < item.x ? 1 : -1; 
                    targetAngle = (currentPointerX - item.x) * 0.003;
                    targetAngle = Math.min(Math.max(targetAngle, -0.6), 0.6);
                }

                ctx.save();
                let displayName = chemNames[item.chem] || item.chem;
                let hasFormula = displayName.includes(' (');
                let nameText = hasFormula ? displayName.split(' (')[0] : displayName;
                let formulaText = hasFormula ? '(' + displayName.split(' (')[1] : '';
                let volText = `ปริมาตร: ${Math.round(item.vol)} มล.`;

                ctx.font = '600 11.5px "Prompt", sans-serif';
                let nameW = ctx.measureText(nameText).width;
                ctx.font = '400 10px "Prompt", sans-serif';
                let formulaW = hasFormula ? ctx.measureText(formulaText).width : 0;
                let volW = ctx.measureText(volText).width;

                let maxContentW = Math.max(nameW, formulaW, volW);
                let badgeW = Math.max(120, maxContentW + 24); 
                let badgeH = hasFormula ? 62 : 48;
                let badgeX = -badgeW / 2;
                
                // ย้ายป้ายมาด้านล่างบีกเกอร์ (ใต้ฐานแก้วลงมา 25 พิกเซล)
                let badgeY = 25; 

                // วาดแผ่นป้ายทึบแสง
                ctx.fillStyle = '#0f172a';
                ctx.strokeStyle = isSelected ? '#38bdf8' : 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 1.5;
                
                if (ctx.roundRect) {
                    ctx.beginPath(); ctx.roundRect(badgeX, badgeY, badgeW, badgeH, 10);
                    ctx.fill(); ctx.stroke();
                } else {
                    ctx.fillRect(badgeX, badgeY, badgeW, badgeH); ctx.strokeRect(badgeX, badgeY, badgeW, badgeH);
                }

                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 4;
                
                // บังคับพิมพ์ชิดซ้ายแล้วคำนวณจุดกึ่งกลางเอง เพื่อแก้ปัญหาฟอนต์เบี้ยวใน iPad/iPhone Safari
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';

                if (hasFormula) {
                    ctx.font = '600 11.5px "Prompt", sans-serif'; ctx.fillStyle = '#ffffff';
                    ctx.fillText(nameText, badgeX + (badgeW - nameW)/2, badgeY + 7);
                    ctx.font = '400 10.5px "Prompt", sans-serif'; ctx.fillStyle = '#7dd3fc';
                    ctx.fillText(formulaText, badgeX + (badgeW - formulaW)/2, badgeY + 25);
                    ctx.font = '400 9.5px "Prompt", sans-serif'; ctx.fillStyle = '#cbd5e1';
                    ctx.fillText(volText, badgeX + (badgeW - volW)/2, badgeY + 42);
                } else {
                    ctx.font = '600 11.5px "Prompt", sans-serif'; ctx.fillStyle = '#ffffff';
                    ctx.fillText(displayName, badgeX + (badgeW - nameW)/2, badgeY + 10);
                    ctx.font = '400 9.5px "Prompt", sans-serif'; ctx.fillStyle = '#cbd5e1';
                    ctx.fillText(volText, badgeX + (badgeW - volW)/2, badgeY + 28);
                }
                ctx.restore();

                ctx.save();
                ctx.rotate(targetAngle);
                ctx.scale(flip, 1); 

                if (item.isExplosion) { ctx.shadowColor = 'rgba(239, 68, 68, 0.95)'; ctx.shadowBlur = 40 + Math.sin(time*10)*15; } 
                else if (item.isNuclear) { ctx.shadowColor = 'rgba(34, 197, 94, 0.95)'; ctx.shadowBlur = 40 + Math.sin(time*8)*15; } 
                else if (item.isHot) { ctx.shadowColor = 'rgba(244, 63, 94, 0.9)'; ctx.shadowBlur = 25; } 
                else if (item.isCold) { ctx.shadowColor = 'rgba(56, 189, 248, 0.9)'; ctx.shadowBlur = 25; }

                let innerG = ctx.createLinearGradient(-75, 0, 75, 0);
                innerG.addColorStop(0, 'rgba(0,0,0,0.4)');
                innerG.addColorStop(0.15, 'rgba(255,255,255,0.03)');
                innerG.addColorStop(0.85, 'rgba(255,255,255,0.03)');
                innerG.addColorStop(1, 'rgba(0,0,0,0.4)');
                ctx.fillStyle = innerG;
                ctx.beginPath();
                ctx.moveTo(-75, -225); ctx.lineTo(-75, 0);
                ctx.ellipse(0, 0, 75, 12, 0, Math.PI, 0, true);
                ctx.lineTo(75, -225);
                ctx.ellipse(0, -225, 75, 12, 0, 0, Math.PI, true);
                ctx.fill();
                ctx.shadowBlur = 0;

                const liquidHeight = (item.vol / item.maxVol) * 195;
                if (liquidHeight > 0) {
                    ctx.save();
                    
                    // คลิปปิ้งมาสก์ให้อยู่ในขอบเขตบีกเกอร์
                    ctx.beginPath();
                    ctx.moveTo(-73, -225); ctx.lineTo(-73, 0);
                    ctx.ellipse(0, 0, 73, 11, 0, Math.PI, 0, true);
                    ctx.lineTo(73, -225);
                    ctx.clip();

                    const netAngle = - (targetAngle * flip) + (item.slosh * flip); 
                    const yOffsetL = -73 * Math.tan(netAngle);
                    const yOffsetR = 73 * Math.tan(netAngle);

                    // คำนวณการยืดวงรีผิวน้ำ (Stretch) ชดเชยการเอียง เพื่อให้ชนขอบแก้วเสมอ
                    const cosAngle = Math.max(0.1, Math.cos(netAngle));
                    const surfaceRadiusX = 73 / cosAngle;
                    const innerRadiusX = 71 / cosAngle;

                    ctx.fillStyle = chemColors[item.chem] || 'rgba(56, 189, 248, 0.55)';
                    
                    // ตัวของเหลว (Liquid Body with Volumetric Shadow)
                    ctx.beginPath();
                    ctx.moveTo(-73, -liquidHeight + yOffsetL);
                    ctx.lineTo(-73, 0);
                    ctx.ellipse(0, 0, 73, 11, 0, Math.PI, 0, true);
                    ctx.lineTo(73, -liquidHeight + yOffsetR);
                    ctx.fill();

                    // เพิ่มเลเยอร์ความลึก 3 มิติให้ของเหลว
                    let volShadow = ctx.createLinearGradient(-73, 0, 73, 0);
                    volShadow.addColorStop(0, 'rgba(0,0,0,0.5)');
                    volShadow.addColorStop(0.3, 'rgba(255,255,255,0.08)');
                    volShadow.addColorStop(0.7, 'rgba(255,255,255,0.08)');
                    volShadow.addColorStop(1, 'rgba(0,0,0,0.6)');
                    ctx.fillStyle = volShadow;
                    ctx.fill();

                    // === ส่วนที่แก้ไขผิวน้ำ (Meniscus & Surface Depth) ===
                    const surfaceColor = chemColors[item.chem] || 'rgba(56, 189, 248, 0.55)';

                    ctx.save();
                    // ย้ายพิกัดและหมุนตามความเอียงของผิวน้ำ เพื่อให้แสงและเงาเรียงตัวเพอร์เฟกต์
                    ctx.translate(0, -liquidHeight);
                    ctx.rotate(netAngle);

                    // 1. สีพื้นของผิวน้ำ (Solid Base)
                    ctx.beginPath();
                    ctx.ellipse(0, 0, surfaceRadiusX, 11, 0, 0, Math.PI * 2);
                    ctx.fillStyle = surfaceColor;
                    ctx.fill();

                    // 2. เติมเงาและแสงสะท้อนไล่ระดับแบบนุ่มนวล (Smooth Gradient Blend)
                    // ไล่สีจากหลัง (มืด) ไปหน้า (สว่าง) ขจัดปัญหาเส้นตัดแบ่งสี
                    let surfaceShine = ctx.createLinearGradient(0, -11, 0, 11);
                    surfaceShine.addColorStop(0, 'rgba(0, 0, 0, 0.35)');       // ขอบหลังมืดลึก
                    surfaceShine.addColorStop(0.35, 'rgba(255, 255, 255, 0)'); // กลางใส กลมกลืนไปกับสีน้ำ
                    surfaceShine.addColorStop(0.75, 'rgba(255, 255, 255, 0.15)'); // เริ่มสว่างนวลๆ ที่ขอบหน้า
                    surfaceShine.addColorStop(1, 'rgba(255, 255, 255, 0.6)'); // ขอบหน้าสว่างสะท้อนแสงไฟ
                    ctx.fillStyle = surfaceShine;
                    ctx.fill();

                    // 3. เส้นวงแหวนความลึกด้านในแบบนุ่มนวล (Soft Inner Glow) แทนเส้นทื่อๆ
                    ctx.beginPath();
                    ctx.ellipse(0, 0, surfaceRadiusX - 1.5, 9.5, 0, 0, Math.PI * 2);
                    let innerGlow = ctx.createLinearGradient(0, -9.5, 0, 9.5);
                    innerGlow.addColorStop(0, 'rgba(0, 0, 0, 0.15)');
                    innerGlow.addColorStop(0.5, 'rgba(255, 255, 255, 0)');
                    innerGlow.addColorStop(1, 'rgba(255, 255, 255, 0.3)');
                    ctx.lineWidth = 1.5;
                    ctx.strokeStyle = innerGlow;
                    ctx.stroke();

                    // 4. แรงตึงผิว (Meniscus) - ขอบหลัง (เงาดำ)
                    ctx.beginPath();
                    ctx.ellipse(0, 0, surfaceRadiusX, 11, 0, Math.PI, 0, false);
                    ctx.lineWidth = 1.2;
                    ctx.strokeStyle = 'rgba(0, 0, 0, 0.35)';
                    ctx.stroke();

                    // 5. แรงตึงผิว (Meniscus) - ขอบหน้า (สว่างกระจ่าง)
                    ctx.beginPath();
                    ctx.ellipse(0, 0, surfaceRadiusX, 11, 0, 0, Math.PI, false);
                    ctx.lineWidth = 2.5;
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
                    ctx.stroke();

                    ctx.restore();
                    // ===============================================
                    
                    if (item.splash > 0) {
                        ctx.fillStyle = 'rgba(255,255,255,0.6)';
                        for(let s=0; s<3; s++) {
                            ctx.beginPath();
                            ctx.arc((s-1)*15, -liquidHeight - (Math.sin(item.splash*Math.PI)*15) + (s*3), item.splash*4, 0, Math.PI*2);
                            ctx.fill();
                        }
                    }
                    ctx.restore();
                }

                if (item.hasPrecipitate) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(-73, -liquidHeight); ctx.lineTo(-73, 0);
                    ctx.ellipse(0, 0, 73, 11, 0, Math.PI, 0, true);
                    ctx.lineTo(73, -liquidHeight);
                    ctx.clip();

                    const isYellow = (item.chem === 'yellow_ppt');
                    const isBlue = (item.chem === 'cu_oh2_ppt');
                    const isRed = (item.chem === 'brick_red_ppt');
                    const mainColor = isYellow ? '250, 204, 21' : (isBlue ? '56, 189, 248' : (isRed ? '220, 38, 38' : '241, 245, 249'));
                    const darkColor = isYellow ? '180, 120, 10' : (isBlue ? '14, 116, 144' : (isRed ? '153, 27, 27' : '148, 163, 184'));

                    const settleRatio = Math.min(1.0, item.sedimentTime * 0.2);
                    
                    const cloudGrad = ctx.createLinearGradient(0, 0, 0, -liquidHeight);
                    cloudGrad.addColorStop(0, `rgba(${mainColor}, ${0.8 - (settleRatio*0.5)})`);
                    cloudGrad.addColorStop(1, `rgba(${mainColor}, 0.0)`);
                    ctx.fillStyle = cloudGrad;
                    ctx.fillRect(-73, -liquidHeight, 146, liquidHeight);

                    const baseHeap = 10 + (25 * settleRatio);
                    const sedimentGrad = ctx.createLinearGradient(0, 0, 0, -baseHeap - 10);
                    sedimentGrad.addColorStop(0, `rgba(${darkColor}, 0.95)`);
                    sedimentGrad.addColorStop(1, `rgba(${mainColor}, 0.4)`);
                    ctx.fillStyle = sedimentGrad;
                    
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 72, 10, 0, Math.PI, 0, true);
                    for (let x = 72; x >= -72; x -= 6) {
                        const ridge = Math.sin(x*0.15)*3 + Math.cos(x*0.3)*2;
                        ctx.lineTo(x, -baseHeap + ridge);
                    }
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                }

                ctx.fillStyle = 'rgba(148, 163, 184, 0.9)';
                ctx.strokeStyle = 'rgba(148, 163, 184, 0.9)';
                for (let mark = 200; mark <= 1000; mark += 200) {
                    let markY = - (mark / 1000) * 195;
                    ctx.beginPath();
                    ctx.moveTo(35, markY); ctx.lineTo(50, markY);
                    ctx.lineWidth = 1.5; ctx.stroke();
                    
                    ctx.save();
                    ctx.translate(54, markY);
                    ctx.scale(flip, 1); 
                    ctx.textAlign = flip === 1 ? 'left' : 'right';
                    ctx.textBaseline = 'middle';
                    ctx.font = '10px "Prompt", sans-serif';
                    ctx.fillText(mark, 0, 0);
                    ctx.restore();
                }

                let glassShine = ctx.createLinearGradient(-75, 0, 75, 0);
                glassShine.addColorStop(0, 'rgba(255,255,255,0.0)');
                glassShine.addColorStop(0.08, 'rgba(255,255,255,0.4)'); 
                glassShine.addColorStop(0.12, 'rgba(255,255,255,0.0)');
                glassShine.addColorStop(0.9, 'rgba(255,255,255,0.0)');
                glassShine.addColorStop(0.96, 'rgba(255,255,255,0.2)');
                glassShine.addColorStop(1, 'rgba(255,255,255,0.0)');
                ctx.fillStyle = glassShine;
                ctx.beginPath();
                ctx.moveTo(-75, -225); ctx.lineTo(-75, 0);
                ctx.ellipse(0, 0, 75, 12, 0, Math.PI, 0, true);
                ctx.lineTo(75, -225);
                ctx.ellipse(0, -225, 75, 12, 0, 0, Math.PI, true);
                ctx.fill();

                if (item.isCold && liquidHeight > 0) {
                    let frost = ctx.createLinearGradient(0, 0, 0, -liquidHeight);
                    frost.addColorStop(0, 'rgba(255,255,255,0.3)');
                    frost.addColorStop(1, 'rgba(255,255,255,0.0)');
                    ctx.fillStyle = frost;
                    ctx.fill();
                }

                ctx.strokeStyle = isSelected ? '#38bdf8' : 'rgba(148, 163, 184, 0.75)';
                ctx.lineWidth = 3;
                
                ctx.beginPath();
                ctx.moveTo(-75, -215); ctx.lineTo(-75, 0);
                ctx.ellipse(0, 0, 75, 12, 0, Math.PI, 0, true);
                ctx.lineTo(75, -225);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(75, -225);
                ctx.bezierCurveTo(75, -231.6, 41.4, -237, 0, -237);
                ctx.bezierCurveTo(-45, -237, -75, -233, -88, -225); 
                ctx.bezierCurveTo(-75, -217, -45, -213, 0, -213);
                ctx.bezierCurveTo(41.4, -213, 75, -218.4, 75, -225);
                ctx.closePath();
                ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.fill(); ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(-88, -225); ctx.quadraticCurveTo(-78, -223, -75, -215);
                ctx.lineWidth = 1.5;
                ctx.strokeStyle = isSelected ? 'rgba(56, 189, 248, 0.6)' : 'rgba(255,255,255,0.3)';
                ctx.stroke();

                ctx.fillStyle = isSelected ? '#38bdf8' : 'rgba(203, 213, 225, 0.9)';
                ctx.beginPath(); ctx.arc(0, -235, 10, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2.5; ctx.stroke();

                if (item.isHot || item.isCold) {
                    const tX = -105; const tY = -100;
                    ctx.fillStyle = 'rgba(15,23,42,0.8)';
                    ctx.beginPath(); ctx.roundRect(tX-6, tY-45, 12, 90, 6); ctx.fill();
                    
                    ctx.fillStyle = 'rgba(255,255,255,0.1)';
                    ctx.beginPath(); ctx.roundRect(tX-2, tY-40, 4, 75, 2); ctx.fill();
                    
                    const thermoColor = item.isHot ? '#ef4444' : '#38bdf8';
                    const thermoH = item.isHot ? 65 : 15;
                    ctx.fillStyle = thermoColor;
                    ctx.beginPath(); ctx.roundRect(tX-2, tY+35 - thermoH, 4, thermoH, 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(tX, tY+35, 6, 0, Math.PI*2); ctx.fill();
                }

                if (item.hasBubbles && liquidHeight > 0) {
                    for (let i = 0; i < 7; i++) {
                        let wobble = Math.sin(time*3+i)*4;
                        let bX = -45 + (i*15) + wobble;
                        let bY = -15 - ((time*35 + i*25) % Math.max(20, liquidHeight));
                        if (bY > -liquidHeight) {
                            ctx.beginPath(); ctx.arc(bX, bY, 4, 0, Math.PI*2);
                            ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1; ctx.stroke();
                            ctx.fillStyle = 'rgba(255,255,255,0.9)';
                            ctx.beginPath(); ctx.arc(bX-1.5, bY-1.5, 1, 0, Math.PI*2); ctx.fill(); 
                        }
                    }
                }

                if ((item.isHot || item.isCold || item.isExplosion) && liquidHeight > 0) {
                    if (Math.random() < 0.4) {
                        item.steamParticles.push({
                            x: (Math.random() - 0.5) * 80,
                            y: item.isCold ? -230 : -liquidHeight, 
                            vx: (Math.random() - 0.5) * 1.5,
                            vy: item.isCold ? 0.5 + Math.random() : -1 - Math.random() * 2,
                            life: 1.0, size: 4 + Math.random()*8
                        });
                    }
                }
                
                for (let i = item.steamParticles.length - 1; i >= 0; i--) {
                    let p = item.steamParticles[i];
                    p.x += p.vx; p.y += p.vy;
                    p.life -= 0.015; p.size += 0.4;
                    if (p.life <= 0) { item.steamParticles.splice(i, 1); } 
                    else {
                        ctx.fillStyle = item.isCold ? `rgba(200, 240, 255, ${p.life*0.2})` : `rgba(255, 255, 255, ${p.life*0.25})`;
                        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
                    }
                }

                ctx.restore();
                ctx.restore(); 
            });

            requestAnimationFrame(drawLab);
        }

        resizeCanvas();
        requestAnimationFrame(drawLab);
    </script>
</body>
</html>
